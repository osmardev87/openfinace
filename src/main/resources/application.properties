spring.application.name=finace
server.port=8089

# ========================================
# Upload de arquivos
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ========================================
# JWT (Usa variável de ambiente ou o valor padrão longo/seguro)
# ========================================
jwt.secret=${JWT_SECRET:MinhaChaveSecretaSuperSeguraCom32CaracteresOuMais1234567890}
jwt.expiration=86400
logging.level.org.springframework.security=DEBUG

# ========================================
# PostgreSQL
# ========================================
spring.datasource.url=jdbc:postgresql://ep-cold-wave-axbaawdl.c-4.us-east-2.aws.neon.tech/openshop?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_VyF0q8HthpPT
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ========================================
# Flyway
# ========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ========================================
# ✅ SWAGGER — CORRIGIDO DEFINITIVAMENTE!
# ========================================
springdoc.swagger-ui.path=/doc
springdoc.api-docs.path=/api-docs

# ✅ Desativa validação e exemplos
springdoc.swagger-ui.validatorUrl=none
springdoc.swagger-ui.display-default-models=false
springdoc.swagger-ui.show-common-extensions=false
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json